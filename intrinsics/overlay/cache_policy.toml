# Reviewed L2 cache-eviction policies produced by `createpolicy`.

schema = 65
family = "cache_policy"

#
# `createpolicy` has no NVVM intrinsic record in the pinned LLVM import, so
# every form enters the catalog as a PTX-native contract lowered through pure
# inline PTX on both backends. The produced 64-bit value is opaque and feeds
# the `.L2::cache_hint` operand of the bulk-copy, TMA, and prefetch families.
# The secondary priority defaults to `evict_unchanged` when omitted, so only
# the explicit `.L2::evict_first` secondary gets its own variants.

[[intrinsic]]
id = "createpolicy_fractional_evict_last"
abi_id = "i1039"
operation_key = "memory.cache_policy.l2.fractional.evict_last"
family = "cache_policy"
source = { kind = "ptx_native", instruction = "createpolicy.fractional.L2::evict_last.b64" }
rust_module = "cache_policy"
rust_name = "createpolicy_fractional_evict_last"
rust_arguments = ["f32"]
rust_result = "u64"
safe = true
must_use = true
safe_allowlist_reason = "Computes an opaque L2 cache-hint value; it has no memory, pointer, synchronization, or participation effects."
public_rust_path = "cuda_intrinsics::cache_policy::createpolicy_fractional_evict_last"
compatibility_rust_paths = ["cuda_device::cache_policy::createpolicy_fractional_evict_last"]
dialect_op_type = "CreatepolicyFractionalEvictLastOp"
dialect_op_name = "nvvm.createpolicy_fractional_evict_last"
dialect_operands = ["f32"]
dialect_results = ["i64"]
pure = true
memory = "none"
convergent = false
execution_scope = "thread"
minimum_ptx = "7.4"
minimum_sm = "sm_80"
ptx_result = "u64"
targets = "all"
ptx_isa_version = "9.3"
ptx_isa_section = "9.7.9.19 Data Movement and Conversion Instructions: createpolicy"
ptx_isa_url = "https://docs.nvidia.com/cuda/parallel-thread-execution/#data-movement-and-conversion-instructions-createpolicy"
lowering = "generated_cache_policy_inline_ptx"
backend_lowerings = [
    { backend = "llvm_nvptx", mechanism = "inline_ptx", evidence_profile = "rust-llvm-23.1.0-16696adc" },
    { backend = "lib_nvvm", mechanism = "inline_ptx", evidence_profile = "cuda-13.3-libnvvm-13.3.73-cache-policy" },
]
cache_policy = { form = "fractional", primary = "evict_last", secondary = "evict_unchanged" }
expected_ptx = { mnemonic = "createpolicy", modifiers = ["fractional", "L2::evict_last", "b64"], operands = [{ kind = "register" }, { kind = "register" }] }
summary = "Creates an L2 cache policy that marks the given fraction of accessed lines evict-last and leaves the rest unchanged."

